components:
  securitySchemes:
    bootstrapSecret:
      type: apiKey
      in: header
      name: X-Bootstrap-Secret
    supportSecret:
      type: apiKey
      in: header
      name: X-Support-Secret
    supportBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
    staffCookie:
      type: apiKey
      in: cookie
      name: rms_staff_session
    guestCookie:
      type: apiKey
      in: cookie
      name: rms_guest_session

  parameters:
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      schema: {type: string, format: uuid}
    BranchId:
      name: branchId
      in: path
      required: true
      schema: {type: string, format: uuid}
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema: {type: string, format: uuid}
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: {type: string, format: uuid}
    DishId:
      name: dishId
      in: path
      required: true
      schema: {type: string, format: uuid}
    OptionGroupId:
      name: optionGroupId
      in: path
      required: true
      schema: {type: string, format: uuid}
    TableId:
      name: tableId
      in: path
      required: true
      schema: {type: string, format: uuid}
    QrCodeId:
      name: qrCodeId
      in: path
      required: true
      schema: {type: string, format: uuid}
    QrToken:
      name: qrToken
      in: path
      required: true
      schema: {type: string, minLength: 32, maxLength: 256}
    OrderId:
      name: orderId
      in: path
      required: true
      schema: {type: string, format: uuid}
    WorkItemId:
      name: workItemId
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
    ExpectedVersion:
      name: If-Match
      in: header
      required: true
      description: Quoted integer aggregate version.
      schema: {type: string, pattern: '^"[0-9]+"$'}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    PageSize:
      name: pageSize
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}

  responses:
    Unauthorized:
      description: Authentication required.
      content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}
    Forbidden:
      description: Authenticated but not authorized.
      content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}
    NotFound:
      description: Resource absent or not visible in the current scope.
      content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}
    Conflict:
      description: State, version, menu, table, payment, or idempotency conflict.
      content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}
    ValidationFailed:
      description: Request validation failed.
      content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After: {schema: {type: integer}}
      content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}
    ServiceUnavailable:
      description: A required delivery dependency is unavailable.
      content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}

  schemas:
    StaffSession:
      type: object
      required: [employeeId, activeBranchId, authorizedBranchIds, grants, expiresAt]
      properties:
        employeeId: {type: string, format: uuid}
        activeBranchId: {type: [string, "null"], format: uuid}
        authorizedBranchIds: {type: array, items: {type: string, format: uuid}}
        grants: {type: array, items: {$ref: "#/components/schemas/PermissionGrant"}}
        expiresAt: {type: string, format: date-time}

    Employee:
      type: object
      required: [id, businessAccountId, restaurantId, displayName, email, status, version, branchIds]
      properties:
        id: {type: string, format: uuid}
        businessAccountId: {type: string, format: uuid}
        restaurantId: {type: string, format: uuid}
        displayName: {type: string}
        email: {type: string, format: email}
        status: {type: string, enum: [active, inactive]}
        version: {type: integer, minimum: 1}
        branchIds: {type: array, uniqueItems: true, items: {type: string, format: uuid}}

    CreateEmployee:
      type: object
      required: [restaurantId, displayName, email, branchIds]
      properties:
        restaurantId: {type: string, format: uuid}
        displayName: {type: string, minLength: 1, maxLength: 160}
        email: {type: string, format: email, maxLength: 320}
        branchIds: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string, format: uuid}}

    UpdateEmployee:
      type: object
      minProperties: 1
      properties:
        displayName: {type: string, minLength: 1, maxLength: 160}
        email: {type: string, format: email, maxLength: 320}
        status: {type: string, enum: [active]}

    Category:
      type: object
      required: [id, businessAccountId, restaurantId, name, displayOrder, status, version]
      properties:
        id: {type: string, format: uuid}
        businessAccountId: {type: string, format: uuid}
        restaurantId: {type: string, format: uuid}
        name: {type: string}
        displayOrder: {type: integer, minimum: 0}
        status: {type: string, enum: [active, inactive]}
        version: {type: integer, minimum: 1}

    CreateCategory:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        displayOrder: {type: integer, minimum: 0, maximum: 10000, default: 0}

    UpdateCategory:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        displayOrder: {type: integer, minimum: 0, maximum: 10000}
        status: {type: string, enum: [active, inactive]}

    AdminOption:
      type: object
      required: [id, name, priceDelta, displayOrder, status, version]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        priceDelta: {$ref: "#/components/schemas/Money"}
        displayOrder: {type: integer, minimum: 0}
        status: {type: string, enum: [active, inactive]}
        version: {type: integer, minimum: 1}

    AdminOptionGroup:
      type: object
      required: [id, dishId, name, selectionType, isRequired, minimum, maximum, displayOrder, version, options]
      properties:
        id: {type: string, format: uuid}
        dishId: {type: string, format: uuid}
        name: {type: string}
        selectionType: {type: string, enum: [single, multiple]}
        isRequired: {type: boolean}
        minimum: {type: integer, minimum: 0}
        maximum: {type: integer, minimum: 1}
        displayOrder: {type: integer, minimum: 0}
        version: {type: integer, minimum: 1}
        options: {type: array, items: {$ref: "#/components/schemas/AdminOption"}}

    OptionInput:
      type: object
      required: [name, priceDelta]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        priceDelta: {$ref: "#/components/schemas/Money"}
        displayOrder: {type: integer, minimum: 0, maximum: 10000, default: 0}

    CreateOptionGroup:
      type: object
      required: [dishId, name, selectionType, minimumSelections, maximumSelections, options]
      properties:
        dishId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 160}
        selectionType: {type: string, enum: [single, multiple]}
        isRequired: {type: boolean, default: false}
        minimumSelections: {type: integer, minimum: 0, maximum: 50}
        maximumSelections: {type: integer, minimum: 1, maximum: 50}
        displayOrder: {type: integer, minimum: 0, maximum: 10000, default: 0}
        options: {type: array, minItems: 1, maxItems: 50, items: {$ref: "#/components/schemas/OptionInput"}}

    UpdateOptionGroup:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        isRequired: {type: boolean}
        minimumSelections: {type: integer, minimum: 0, maximum: 50}
        maximumSelections: {type: integer, minimum: 1, maximum: 50}
        displayOrder: {type: integer, minimum: 0, maximum: 10000}

    ReplaceOptions:
      type: object
      required: [options]
      properties:
        options:
          type: array
          minItems: 1
          maxItems: 50
          items:
            allOf:
              - $ref: "#/components/schemas/OptionInput"
              - type: object
                properties:
                  status: {type: string, enum: [active, inactive], default: active}

    AdminDish:
      type: object
      required: [id, businessAccountId, restaurantId, categoryId, name, basePrice, status, available, displayOrder, version]
      properties:
        id: {type: string, format: uuid}
        businessAccountId: {type: string, format: uuid}
        restaurantId: {type: string, format: uuid}
        categoryId: {type: string, format: uuid}
        name: {type: string}
        description: {type: [string, "null"]}
        imageUrl: {type: [string, "null"], format: uri}
        basePrice: {$ref: "#/components/schemas/Money"}
        status: {type: string, enum: [active, inactive]}
        available: {type: boolean}
        displayOrder: {type: integer, minimum: 0}
        version: {type: integer, minimum: 1}

    CreateDish:
      type: object
      required: [categoryId, name, basePrice]
      properties:
        categoryId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, minLength: 1, maxLength: 1000}
        imageUrl: {type: string, format: uri, maxLength: 2048}
        basePrice: {$ref: "#/components/schemas/Money"}
        displayOrder: {type: integer, minimum: 0, maximum: 10000, default: 0}

    UpdateDish:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        description: {type: [string, "null"], minLength: 1, maxLength: 1000}
        imageUrl: {type: [string, "null"], format: uri, maxLength: 2048}
        categoryId: {type: string, format: uuid}
        displayOrder: {type: integer, minimum: 0, maximum: 10000}
        basePrice: {$ref: "#/components/schemas/Money"}
        available: {type: boolean}
        status: {type: string, enum: [active, inactive]}

    BranchDishOverride:
      type: object
      required: [businessAccountId, branchId, dishId, visible, version]
      properties:
        businessAccountId: {type: string, format: uuid}
        branchId: {type: string, format: uuid}
        dishId: {type: string, format: uuid}
        price: {oneOf: [{$ref: "#/components/schemas/Money"}, {type: "null"}]}
        available: {type: [boolean, "null"]}
        visible: {type: boolean}
        version: {type: integer, minimum: 0}

    UpsertBranchOverride:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, minimum: 0, description: "Pass 0 when no override exists yet for this branch/dish pair."}
        price: {oneOf: [{$ref: "#/components/schemas/Money"}, {type: "null"}]}
        available: {type: [boolean, "null"]}
        visible: {type: boolean}

    AdminTable:
      type: object
      required: [id, businessAccountId, branchId, code, status, outOfService, version, derivedState]
      properties:
        id: {type: string, format: uuid}
        businessAccountId: {type: string, format: uuid}
        branchId: {type: string, format: uuid}
        code: {type: string}
        area: {type: [string, "null"]}
        status: {type: string, enum: [active, inactive]}
        outOfService: {type: boolean}
        version: {type: integer, minimum: 1}
        derivedState: {type: string, enum: [inactive, out_of_service, occupied, available]}

    CreateTable:
      type: object
      required: [code]
      properties:
        code: {type: string, minLength: 1, maxLength: 32}
        area: {type: string, minLength: 1, maxLength: 120}

    UpdateTable:
      type: object
      minProperties: 1
      properties:
        code: {type: string, minLength: 1, maxLength: 32}
        area: {type: [string, "null"], minLength: 1, maxLength: 120}
        status: {type: string, enum: [active, inactive]}
        outOfService: {type: boolean}

    TableQrCode:
      type: object
      required: [id, businessAccountId, branchId, kind, status, createdAtUtc]
      properties:
        id: {type: string, format: uuid}
        businessAccountId: {type: string, format: uuid}
        branchId: {type: string, format: uuid}
        tableId: {type: [string, "null"], format: uuid}
        kind: {type: string, enum: [table, branch]}
        status: {type: string, enum: [active, revoked]}
        createdAtUtc: {type: string, format: date-time}
        revokedAtUtc: {type: [string, "null"], format: date-time}
        revokedReason: {type: [string, "null"]}

    IssuedQrCode:
      type: object
      required: [qrCode, rawToken, qrUrl]
      properties:
        qrCode: {$ref: "#/components/schemas/TableQrCode"}
        rawToken: {type: string, description: "Returned once to the authorized administrator at issuance; only its hash is stored."}
        qrUrl: {type: string, format: uri, description: "Standard HTTPS URL encoded into the printed QR image (NFR-17-03), embedding rawToken."}

    PermissionKey:
      type: string
      enum: [restaurant.view, restaurant.edit, branches.view, branches.manage, features.manage, employees.view, employees.manage, employees.manage_permissions, menu.view, menu.manage, menu.manage_prices, menu.manage_availability, qr.manage, tables.view, tables.manage, tables.assign, tables.close_session, orders.view, orders.create, orders.accept, orders.reject, orders.modify, orders.cancel, orders.serve, orders.complete, orders.complete_unpaid, kitchen.view, kitchen.update, payments.view, payments.record, payments.refund, reports.view, reports.view_cross_branch, audit.view, support.break_glass]

    PermissionGrant:
      type: object
      required: [permissionKey]
      properties:
        permissionKey: {$ref: "#/components/schemas/PermissionKey"}
        restaurantId: {type: string, format: uuid}
        branchId: {type: string, format: uuid}

    PermissionSet:
      type: object
      required: [employeeId, version, grants]
      properties:
        employeeId: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        grants: {type: array, items: {$ref: "#/components/schemas/PermissionGrant"}}

    PermissionTemplate:
      type: object
      required: [key, displayName, permissionKeys, version]
      properties:
        key: {type: string, enum: [administrator, general_staff, cashier, kitchen_staff]}
        displayName: {type: string}
        permissionKeys: {type: array, items: {$ref: "#/components/schemas/PermissionKey"}}
        version: {type: integer, minimum: 1}

    PermissionDefinition:
      type: object
      required: [key, id, module, scope, risk]
      properties:
        key: {$ref: "#/components/schemas/PermissionKey"}
        id: {type: string, pattern: "^PERM-[0-9]{3}$"}
        module: {type: string}
        scope: {type: string, enum: [platform, restaurant, branch]}
        risk: {type: string, enum: [low, medium, high, critical]}
        delegableSubsetOnly: {type: boolean}

    FeatureConfiguration:
      type: object
      required: [id, businessAccountId, restaurantId, version, values, createdAtUtc]
      properties:
        id: {type: string, format: uuid}
        businessAccountId: {type: string, format: uuid}
        restaurantId: {type: string, format: uuid}
        branchId: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        values:
          type: object
          additionalProperties: {type: string, enum: [enabled, disabled, automatic, unavailable]}
        createdAtUtc: {type: string, format: date-time}

    FeatureDefinition:
      type: object
      required: [id, key, kind, scope, mvp, defaultState, dependsOn, mutableInMvp]
      properties:
        id: {type: string, pattern: "^CFG-[0-9]{3}$"}
        key: {type: string}
        kind: {type: string, enum: [core_module, optional_module, capability, strategy, integration]}
        scope: {type: string, enum: [platform, restaurant, branch]}
        mvp: {type: boolean}
        defaultState: {type: string, enum: [enabled, disabled, automatic, unavailable]}
        dependsOn: {type: array, items: {type: string}}
        mutableInMvp: {type: boolean}
        disablePolicy: {type: string}

    FeatureConfigurationResult:
      type: object
      required: [configuration, catalog]
      properties:
        configuration: {$ref: "#/components/schemas/FeatureConfiguration"}
        catalog: {type: array, items: {$ref: "#/components/schemas/FeatureDefinition"}}

    PortalCapabilities:
      type: object
      required: [branchId, permissions, enabledFeatures, configurationVersion]
      properties:
        branchId: {type: string, format: uuid}
        permissions: {type: array, items: {$ref: "#/components/schemas/PermissionKey"}}
        enabledFeatures: {type: array, items: {type: string}}
        configurationVersion: {type: integer, minimum: 1}

    CreateSupportAccessGrant:
      type: object
      required: [businessAccountId, approvalMode, approverId, approvalReference, reason, permissionKeys, expiresAt]
      properties:
        businessAccountId: {type: string, format: uuid}
        approvalMode:
          type: string
          enum: [two_person]
          description: The private MVP adapter has no emergency-policy bypass.
        approverId: {type: string, format: uuid}
        approvalReference: {type: string, minLength: 8, maxLength: 160}
        reason: {type: string, minLength: 8, maxLength: 500}
        permissionKeys:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: {type: string, enum: [restaurant.view, branches.view]}
        restaurantIds: {type: array, maxItems: 100, items: {type: string, format: uuid}}
        branchIds: {type: array, maxItems: 500, items: {type: string, format: uuid}}
        expiresAt: {type: string, format: date-time}

    SupportAccessGrantResult:
      type: object
      required: [grantId, accessToken, expiresAt]
      properties:
        grantId: {type: string, format: uuid}
        accessToken: {type: string, minLength: 32, maxLength: 256, writeOnly: true}
        expiresAt: {type: string, format: date-time}

    SupportTenantSnapshot:
      type: object
      required: [businessAccountId, businessName, restaurants, branches]
      properties:
        businessAccountId: {type: string, format: uuid}
        businessName: {type: string}
        restaurants:
          type: array
          items:
            type: object
            required: [id, name, status]
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              status: {type: string}
        branches:
          type: array
          items:
            type: object
            required: [id, restaurantId, name, status]
            properties:
              id: {type: string, format: uuid}
              restaurantId: {type: string, format: uuid}
              name: {type: string}
              status: {type: string}

    TokenAndPassword:
      type: object
      required: [token, password]
      properties:
        token: {type: string, minLength: 32, maxLength: 256, writeOnly: true}
        password: {type: string, minLength: 12, maxLength: 128, writeOnly: true}

    Reason:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 8, maxLength: 500}

    Address:
      type: object
      required: [line1, city, countryCode]
      properties:
        line1: {type: string, minLength: 1, maxLength: 200}
        line2: {type: string, minLength: 1, maxLength: 200}
        city: {type: string, minLength: 1, maxLength: 120}
        region: {type: string, minLength: 1, maxLength: 120}
        postalCode: {type: string, minLength: 1, maxLength: 32}
        countryCode: {type: string, pattern: "^[A-Z]{2}$"}

    ContactInformation:
      type: object
      minProperties: 1
      properties:
        email: {type: string, format: email, maxLength: 320}
        phone: {type: string, minLength: 5, maxLength: 32}

    OpeningPeriod:
      type: object
      required: [dayOfWeek, opensAt, closesAt]
      properties:
        dayOfWeek: {type: integer, minimum: 0, maximum: 6}
        opensAt: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
        closesAt: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}

    Restaurant:
      type: object
      required: [id, businessAccountId, name, status, branding, settings, version]
      properties:
        id: {type: string, format: uuid}
        businessAccountId: {type: string, format: uuid}
        name: {type: string}
        status: {type: string, enum: [active, inactive]}
        branding: {type: object, additionalProperties: true}
        settings: {type: object, additionalProperties: true}
        version: {type: integer, minimum: 1}

    CreateRestaurant:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        branding: {type: object, additionalProperties: true}
        settings: {type: object, additionalProperties: true}

    UpdateRestaurant:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        status: {type: string, enum: [active, inactive]}
        branding: {type: object, additionalProperties: true}
        settings: {type: object, additionalProperties: true}

    Branch:
      type: object
      required: [id, businessAccountId, restaurantId, name, address, contact, timeZone, currency, status, serviceStatus, allowOrderOverride, version, openingHours]
      properties:
        id: {type: string, format: uuid}
        businessAccountId: {type: string, format: uuid}
        restaurantId: {type: string, format: uuid}
        name: {type: string}
        address: {$ref: "#/components/schemas/Address"}
        contact: {$ref: "#/components/schemas/ContactInformation"}
        timeZone: {type: string}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        status: {type: string, enum: [active, inactive]}
        serviceStatus: {type: string, enum: [open, closed, temporarily_unavailable]}
        allowOrderOverride: {type: boolean}
        version: {type: integer, minimum: 1}
        openingHours: {type: array, items: {$ref: "#/components/schemas/OpeningPeriod"}}

    CreateBranch:
      type: object
      required: [restaurantId, name, address, contact, timeZone, currency, openingHours]
      properties:
        restaurantId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 160}
        address: {$ref: "#/components/schemas/Address"}
        contact: {$ref: "#/components/schemas/ContactInformation"}
        timeZone: {type: string, minLength: 1, maxLength: 100}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        openingHours: {type: array, minItems: 1, maxItems: 28, items: {$ref: "#/components/schemas/OpeningPeriod"}}

    UpdateBranch:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        address: {$ref: "#/components/schemas/Address"}
        contact: {$ref: "#/components/schemas/ContactInformation"}
        timeZone: {type: string, minLength: 1, maxLength: 100}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        status: {type: string, enum: [active, inactive]}
        serviceStatus: {type: string, enum: [open, closed, temporarily_unavailable]}
        allowOrderOverride: {type: boolean}
        openingHours: {type: array, minItems: 1, maxItems: 28, items: {$ref: "#/components/schemas/OpeningPeriod"}}

    TenantBootstrapRequest:
      type: object
      required: [businessCode, businessName, restaurantName, branch, owner]
      properties:
        businessCode: {type: string, minLength: 3, maxLength: 64, pattern: "^[a-z0-9][a-z0-9-]+$"}
        businessName: {type: string, minLength: 1, maxLength: 160}
        restaurantName: {type: string, minLength: 1, maxLength: 160}
        branch:
          allOf:
            - $ref: "#/components/schemas/CreateBranch"
            - type: object
              properties:
                restaurantId: false
        owner:
          type: object
          required: [displayName, email, password]
          properties:
            displayName: {type: string, minLength: 1, maxLength: 160}
            email: {type: string, format: email, maxLength: 320}
            password: {type: string, minLength: 12, maxLength: 128, writeOnly: true}

    TenantBootstrapResult:
      type: object
      required: [businessAccountId, restaurant, branch, employeeId, userId]
      properties:
        businessAccountId: {type: string, format: uuid}
        restaurant: {$ref: "#/components/schemas/Restaurant"}
        branch: {$ref: "#/components/schemas/Branch"}
        employeeId: {type: string, format: uuid}
        userId: {type: string, format: uuid}

    GuestSession:
      type: object
      required: [branchId, tableId, tableCode, expiresAt]
      properties:
        branchId: {type: string, format: uuid}
        tableId: {type: [string, "null"], format: uuid}
        tableCode: {type: [string, "null"], description: "Human-readable table identifier for on-screen verification (AC-US-F02-01); null for a browse-only branch QR."}
        expiresAt: {type: string, format: date-time}

    Menu:
      type: object
      required: [version, currency, categories]
      properties:
        version: {type: string}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        categories:
          type: array
          items:
            type: object
            required: [id, name, dishes]
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              dishes:
                type: array
                items: {$ref: "#/components/schemas/Dish"}

    Dish:
      type: object
      required: [id, name, unitPrice, available]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: [string, "null"]}
        unitPrice: {$ref: "#/components/schemas/Money"}
        available: {type: boolean}
        optionGroups:
          type: array
          items: {$ref: "#/components/schemas/OptionGroup"}

    OptionGroup:
      type: object
      required: [id, name, minimum, maximum, options]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        minimum: {type: integer, minimum: 0}
        maximum: {type: integer, minimum: 1}
        options:
          type: array
          items:
            type: object
            required: [id, name, priceDelta]
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              priceDelta: {$ref: "#/components/schemas/Money"}

    SubmitOrderRequest:
      type: object
      required: [menuVersion, items]
      properties:
        menuVersion: {type: string}
        customerName: {type: [string, "null"], maxLength: 100}
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [dishId, quantity, optionIds]
            properties:
              dishId: {type: string, format: uuid}
              quantity: {type: integer, minimum: 1, maximum: 99}
              optionIds: {type: array, uniqueItems: true, items: {type: string, format: uuid}}
              note: {type: [string, "null"], maxLength: 500}

    Order:
      type: object
      required: [id, reference, version, approval, fulfilment, financial, closure, total, items]
      properties:
        id: {type: string, format: uuid}
        reference: {type: string}
        version: {type: integer, minimum: 1}
        approval: {type: string, enum: [submitted, accepted, rejected]}
        fulfilment: {type: string, enum: [not_started, preparing, ready, served]}
        financial: {type: string, enum: [unpaid, paid, partially_refunded, refunded]}
        closure: {type: string, enum: [active, completed, cancelled]}
        total: {$ref: "#/components/schemas/Money"}
        items:
          type: array
          items:
            type: object
            required: [name, quantity, unitPrice, total]
            properties:
              name: {type: string}
              quantity: {type: integer}
              unitPrice: {$ref: "#/components/schemas/Money"}
              total: {$ref: "#/components/schemas/Money"}
              note: {type: [string, "null"]}

    KitchenWorkItem:
      type: object
      required: [id, version, orderId, orderReference, itemName, quantity, state]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer}
        orderId: {type: string, format: uuid}
        orderReference: {type: string}
        itemName: {type: string}
        quantity: {type: integer}
        note: {type: [string, "null"]}
        state: {type: string, enum: [queued, preparing, ready, cancelled]}

    RecordPaymentRequest:
      type: object
      required: [amount, method]
      properties:
        amount: {$ref: "#/components/schemas/Money"}
        method: {type: string, enum: [cash, card]}
        externalReference: {type: [string, "null"], maxLength: 100}

    Payment:
      type: object
      required: [id, orderId, amount, method, recordedAt]
      properties:
        id: {type: string, format: uuid}
        orderId: {type: string, format: uuid}
        amount: {$ref: "#/components/schemas/Money"}
        method: {type: string, enum: [cash, card]}
        recordedAt: {type: string, format: date-time}

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: {type: string, pattern: "^-?[0-9]+(\\.[0-9]{1,2})?$"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}

    Problem:
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        code:
          type: string
          enum: [validation_error, authentication_required, permission_denied, feature_disabled, resource_not_found, invalid_state_transition, concurrency_conflict, menu_changed, dish_unavailable, table_unavailable, payment_conflict, idempotency_conflict, rate_limited, service_unavailable, unexpected_error]
        detail: {type: [string, "null"]}
        correlationId: {type: string}
        currentVersion: {type: integer, minimum: 1}
        errors:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
