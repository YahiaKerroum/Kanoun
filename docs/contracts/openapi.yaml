openapi: 3.1.0
info:
  title: Restaurant Management System API
  version: 0.1.0
  description: Proposed MVP contract for the Express/TypeScript implementation. Slice 001 validates the document; each operation becomes implementation-authoritative when its delivery slice adds matching server behavior and contract tests.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api
tags:
  - {name: Platform, description: Privately authorized tenant provisioning.}
  - {
      name: Identity,
      description: "Staff identity, sessions, invitations, and recovery.",
    }
  - {name: Configuration, description: Tenant-scoped restaurant and branch configuration.}
  - {name: Menu, description: Restaurant menu structure and branch overrides.}
  - {name: Tables, description: Branch tables and QR code issuance.}
  - {name: Public, description: Unauthenticated and guest-session operations.}
  - {name: Orders, description: Guest and staff order lifecycle operations.}
  - {name: Kitchen, description: Branch kitchen queue and work-item operations.}
  - {name: Payments, description: Staff-recorded payment and correction operations.}
  - {name: Realtime, description: Branch-scoped Server-Sent Events streams.}

paths:
  /v1/platform/tenants:
    post:
      tags: [Platform]
      operationId: bootstrapTenantOwnerRestaurantAndBranch
      summary: Privately provision a tenant, verified owner, restaurant, and branch atomically.
      security: [{bootstrapSecret: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TenantBootstrapRequest"}
      responses:
        "201":
          description: Tenant and protected owner context created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TenantBootstrapResult"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/platform/support-access-grants:
    post:
      tags: [Platform]
      operationId: createSupportAccessGrant
      summary: Create a two-person-approved, read-only, time-limited tenant support grant.
      description: >
        Private system-to-system adapter. The caller is a trusted platform
        control plane that authenticates operator and approver identities and
        supplies its approval reference. This adapter enforces recent operator
        authentication, a distinct approver, least-privilege scope, and a
        four-hour maximum. The MVP exposes no emergency-policy bypass.
      security: [{supportSecret: []}]
      parameters:
        - {name: X-Support-Operator-Id, in: header, required: true, schema: {type: string, format: uuid}}
        - {name: X-Support-Authenticated-At, in: header, required: true, schema: {type: string, format: date-time}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateSupportAccessGrant"}
      responses:
        "201":
          description: Raw support access token returned once.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupportAccessGrantResult"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/platform/support-access-grants/{grantId}:
    delete:
      tags: [Platform]
      operationId: revokeSupportAccessGrant
      summary: Revoke support access and immediately terminate use of its token.
      security: [{supportSecret: []}]
      parameters:
        - {name: grantId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: X-Support-Operator-Id, in: header, required: true, schema: {type: string, format: uuid}}
        - {name: X-Support-Authenticated-At, in: header, required: true, schema: {type: string, format: date-time}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Reason"}
      responses:
        "204":
          description: >
            Grant token invalidated. This adapter creates no derived support
            session or real-time subscription.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/platform/support-access/tenants/{businessAccountId}:
    get:
      tags: [Platform]
      operationId: inspectTenantWithSupportAccess
      summary: Read the least-privilege tenant context permitted by a break-glass grant.
      security: [{supportBearer: []}]
      parameters:
        - {name: businessAccountId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Scoped tenant context; this access is audited.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupportTenantSnapshot"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/auth/login:
    post:
      tags: [Identity]
      operationId: loginStaff
      summary: Create a server-managed, revocable staff session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessCode, email, password]
              properties:
                businessCode: {type: string, minLength: 3, maxLength: 64, pattern: "^[a-z0-9][a-z0-9-]+$"}
                email: {type: string, format: email, maxLength: 320}
                password: {type: string, minLength: 1, maxLength: 1000, writeOnly: true}
      responses:
        "201":
          description: Authenticated; secure session and CSRF cookies are set.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StaffSession"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/auth/session:
    get:
      tags: [Identity]
      operationId: getStaffSession
      summary: Resolve the current revocable staff session.
      security: [{staffCookie: []}]
      responses:
        "200":
          description: Current session context.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StaffSession"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/auth/logout:
    post:
      tags: [Identity]
      operationId: logoutStaff
      summary: Revoke the current staff session.
      security: [{staffCookie: [], csrfHeader: []}]
      responses:
        "204": {description: Session revoked and cookies cleared.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /v1/auth/recovery-requests:
    post:
      tags: [Identity]
      operationId: requestStaffCredentialRecovery
      summary: Request credential recovery without disclosing account existence.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessCode, email]
              properties:
                businessCode: {type: string, minLength: 3, maxLength: 64}
                email: {type: string, format: email, maxLength: 320}
      responses:
        "202": {description: Request accepted regardless of account existence.}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}

  /v1/auth/recovery-completions:
    post:
      tags: [Identity]
      operationId: completeStaffCredentialRecovery
      summary: Consume a recovery token, replace the credential, and revoke existing sessions.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TokenAndPassword"}
      responses:
        "204": {description: Credential replaced and sessions revoked.}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/invitations/accept:
    post:
      tags: [Identity]
      operationId: acceptStaffInvitation
      summary: Consume a single-use invitation without adding grants.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TokenAndPassword"}
      responses:
        "204": {description: Invitation accepted.}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /v1/staff/session/branch:
    post:
      tags: [Identity]
      operationId: switchStaffBranch
      summary: Switch to a branch assigned to the current employee.
      security: [{staffCookie: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchId]
              properties:
                branchId: {type: string, format: uuid}
      responses:
        "200":
          description: Active branch changed.
          content:
            application/json:
              schema:
                type: object
                required: [activeBranchId]
                properties:
                  activeBranchId: {type: string, format: uuid}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /v1/staff/restaurants:
    get:
      tags: [Configuration]
      operationId: listRestaurants
      summary: List restaurants visible in the authenticated tenant scope.
      security: [{staffCookie: []}]
      responses:
        "200":
          description: Tenant-scoped restaurants.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Restaurant"}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [Configuration]
      operationId: createRestaurant
      summary: Create a restaurant inside the authenticated business account.
      security: [{staffCookie: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateRestaurant"}
      responses:
        "201":
          description: Restaurant created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Restaurant"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /v1/staff/restaurants/{restaurantId}:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
    get:
      tags: [Configuration]
      operationId: getRestaurant
      summary: Get a tenant-scoped restaurant.
      security: [{staffCookie: []}]
      responses:
        "200":
          description: Restaurant.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Restaurant"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [Configuration]
      operationId: updateRestaurant
      summary: Edit, activate, or deactivate a restaurant without deleting history.
      security: [{staffCookie: [], csrfHeader: []}]
      parameters:
        - $ref: "#/components/parameters/ExpectedVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateRestaurant"}
      responses:
        "200":
          description: Updated restaurant.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Restaurant"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /v1/staff/branches:
    get:
      tags: [Configuration]
      operationId: listAssignedBranches
      summary: List branches assigned to the authenticated employee.
      security: [{staffCookie: []}]
      responses:
        "200":
          description: Assigned branches.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Branch"}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [Configuration]
      operationId: createBranch
      summary: Create and assign a branch in an authorized restaurant.
      security: [{staffCookie: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateBranch"}
      responses:
        "201":
          description: Branch created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Branch"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /v1/staff/branches/{branchId}:
    parameters:
      - $ref: "#/components/parameters/BranchId"
    get:
      tags: [Configuration]
      operationId: getAssignedBranch
      summary: Get an assigned branch without exposing another tenant or branch.
      security: [{staffCookie: []}]
      responses:
        "200":
          description: Branch.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Branch"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [Configuration]
      operationId: updateBranch
      summary: Configure branch profile, hours, currency, status, and service availability.
      security: [{staffCookie: [], csrfHeader: []}]
      parameters:
        - $ref: "#/components/parameters/ExpectedVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateBranch"}
      responses:
        "200":
          description: Updated branch.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Branch"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /v1/staff/employees/{employeeId}/invitations:
    post:
      tags: [Identity]
      operationId: inviteExistingEmployee
      summary: Create a single-use invitation for an existing employee profile.
      security: [{staffCookie: [], csrfHeader: []}]
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "201":
          description: Raw invitation token returned once to the authorized administrator.
          content:
            application/json:
              schema:
                type: object
                required: [invitationToken, expiresAt]
                properties:
                  invitationToken: {type: string, writeOnly: true}
                  expiresAt: {type: string, format: date-time}
        "404": {$ref: "#/components/responses/NotFound"}

  /v1/staff/employees:
    get:
      tags: [Configuration]
      operationId: listEmployees
      summary: List tenant-scoped employee profiles for an authorized restaurant.
      security: [{staffCookie: []}]
      parameters:
        - {name: restaurantId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Employee profiles.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Employee"}}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [Configuration]
      operationId: createEmployee
      summary: Create an employee profile with delegated branch employment.
      security: [{staffCookie: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateEmployee"}
      responses:
        "201":
          description: Employee created without implicitly creating login credentials.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Employee"}
        "409":
          description: An employee in this restaurant already uses the normalized email address.
          content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /v1/staff/employees/{employeeId}:
    get:
      tags: [Configuration]
      operationId: getEmployee
      summary: Get an authorized employee profile.
      security: [{staffCookie: []}]
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: Employee profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Employee"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [Configuration]
      operationId: updateEmployee
      summary: Edit or reactivate an employee profile with optimistic concurrency.
      security: [{staffCookie: [], csrfHeader: []}]
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
        - $ref: "#/components/parameters/ExpectedVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateEmployee"}
      responses:
        "200":
          description: Updated employee profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Employee"}
        "409":
          description: Stale employee version or normalized email already in use.
          content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}

  /v1/staff/employees/{employeeId}/branches:
    put:
      tags: [Configuration]
      operationId: replaceEmployeeBranches
      summary: Replace delegated branch employment and revoke affected sessions.
      security: [{staffCookie: [], csrfHeader: []}]
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
        - $ref: "#/components/parameters/ExpectedVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Reason"
                - type: object
                  required: [branchIds]
                  properties:
                    branchIds: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string, format: uuid}}
      responses:
        "200":
          description: Updated employee branch scope.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Employee"}
        "409": {$ref: "#/components/responses/Conflict"}

  /v1/staff/permission-templates:
    get:
      tags: [Identity]
      operationId: listPermissionTemplates
      summary: List the four immutable MVP permission templates.
      security: [{staffCookie: []}]
      responses:
        "200":
          description: Copy-on-apply templates.
          content:
            application/json:
              schema:
                type: object
                required: [items, catalog]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/PermissionTemplate"}}
                  catalog: {type: array, items: {$ref: "#/components/schemas/PermissionDefinition"}}
        "403": {$ref: "#/components/responses/Forbidden"}

  /v1/staff/employees/{employeeId}/permissions:
    get:
      tags: [Identity]
      operationId: getEmployeePermissions
      summary: Get the current versioned grants-only permission set.
      security: [{staffCookie: []}]
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: Current permission set.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PermissionSet"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [Identity]
      operationId: replaceEmployeePermissions
      summary: Replace grants within the actor's delegable subset and revoke affected sessions.
      security: [{staffCookie: [], csrfHeader: []}]
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, grants, reason]
              properties:
                expectedVersion: {type: integer, minimum: 1}
                grants: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/PermissionGrant"}}
                reason: {type: string, minLength: 8, maxLength: 500}
      responses:
        "200":
          description: Updated permission set.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PermissionSet"}
        "409": {$ref: "#/components/responses/Conflict"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /v1/staff/employees/{employeeId}/permission-template:
    post:
      tags: [Identity]
      operationId: applyPermissionTemplate
      summary: Copy a predefined template into an employee's current grants.
      security: [{staffCookie: [], csrfHeader: []}]
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateKey, expectedVersion, reason]
              properties:
                templateKey: {type: string, enum: [administrator, general_staff, cashier, kitchen_staff]}
                expectedVersion: {type: integer, minimum: 1}
                reason: {type: string, minLength: 8, maxLength: 500}
      responses:
        "200":
          description: Template grants copied into the employee permission set.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PermissionSet"}
        "409": {$ref: "#/components/responses/Conflict"}

  /v1/staff/branches/{branchId}/features:
    get:
      tags: [Configuration]
      operationId: getFeatureConfiguration
      summary: Get the immutable current feature version and authoritative catalog metadata.
      security: [{staffCookie: []}]
      parameters:
        - $ref: "#/components/parameters/BranchId"
      responses:
        "200":
          description: Feature configuration.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FeatureConfigurationResult"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [Configuration]
      operationId: updateFeatureConfiguration
      summary: Append a dependency-valid feature configuration version.
      security: [{staffCookie: [], csrfHeader: []}]
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/ExpectedVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes, confirmAffectedWorkflows, reason]
              properties:
                changes:
                  type: object
                  minProperties: 1
                  additionalProperties: {type: string, enum: [enabled, disabled]}
                confirmAffectedWorkflows: {type: boolean}
                reason: {type: string, minLength: 8, maxLength: 500}
      responses:
        "200":
          description: Appended feature configuration version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FeatureConfiguration"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /v1/staff/restaurants/{restaurantId}/features:
    get:
      tags: [Configuration]
      operationId: getRestaurantFeatureConfiguration
      summary: Get the immutable current restaurant-scoped feature version.
      security: [{staffCookie: []}]
      parameters:
        - $ref: "#/components/parameters/RestaurantId"
      responses:
        "200":
          description: Restaurant feature configuration.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FeatureConfigurationResult"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [Configuration]
      operationId: updateRestaurantFeatureConfiguration
      summary: Append a dependency-valid restaurant feature version.
      security: [{staffCookie: [], csrfHeader: []}]
      parameters:
        - $ref: "#/components/parameters/RestaurantId"
        - $ref: "#/components/parameters/ExpectedVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes, confirmAffectedWorkflows, reason]
              properties:
                changes:
                  type: object
                  minProperties: 1
                  additionalProperties: {type: string, enum: [enabled, disabled]}
                confirmAffectedWorkflows: {type: boolean}
                reason: {type: string, minLength: 8, maxLength: 500}
      responses:
        "200":
          description: Appended restaurant feature configuration version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FeatureConfiguration"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /v1/staff/branches/{branchId}/capabilities:
    get:
      tags: [Configuration]
      operationId: getPortalCapabilities
      summary: Resolve the authenticated employee's permission- and feature-aware portal capabilities.
      security: [{staffCookie: []}]
      parameters:
        - $ref: "#/components/parameters/BranchId"
      responses:
        "200":
          description: Effective branch capabilities for navigation and action disclosure.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PortalCapabilities"}
        "404": {$ref: "#/components/responses/NotFound"}

  /v1/staff/administrators/{employeeId}/removal:
    post:
      tags: [Identity]
      operationId: removeAdministrator
      summary: Remove administrator grants unless this would remove the final effective administrator.
      security: [{staffCookie: [], csrfHeader: []}]
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Reason"}
      responses:
        "204": {description: Administrator grants removed and sessions revoked.}
        "409": {$ref: "#/components/responses/Conflict"}

  /v1/staff/administrators/transfer:
    post:
      tags: [Identity]
      operationId: transferAdministrator
      summary: Activate a replacement administrator before optionally removing the current administrator.
      security: [{staffCookie: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [replacementEmployeeId, removeCurrentAdministrator, reason]
              properties:
                replacementEmployeeId: {type: string, format: uuid}
                removeCurrentAdministrator: {type: boolean}
