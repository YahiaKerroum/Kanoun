document:
  id: EVENT-CATALOG
  status: approved
  version: "1.0"
  owner: architecture
  last_reviewed: 2026-07-27

delivery:
  mode: at_least_once
  ordering: per_aggregate
  transport_mvp: postgresql_outbox
  idempotency: event_id_per_handler
  retry: bounded_exponential_backoff_with_jitter
  exhausted: quarantine_and_alert

envelope:
  required:
    - event_id
    - event_type
    - schema_version
    - business_account_id
    - aggregate_id
    - aggregate_version
    - occurred_at_utc
    - correlation_id
    - causation_id
    - payload
  optional: [restaurant_id, branch_id, actor_id, trace_context]
  pii_policy: minimum_required_and_redacted

events:
  EVT-IDENTITY-OWNER-BOOTSTRAPPED:
    type: identity.owner_bootstrapped.v1
    owner: identity_access
    aggregate: business_account
    consumers: [notifications, reporting]
