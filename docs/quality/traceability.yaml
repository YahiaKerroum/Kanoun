document:
  id: TRACEABILITY
  status: approved
  version: "1.0"
  owner: quality
  last_reviewed: 2026-07-27

vertical_slices:
  application_bootstrap:
    implements: [NFR-02, NFR-03, NFR-12, NFR-13]
    obeys: [PD-031, ADR-0001, ADR-0002, ADR-0003, ADR-0004, ADR-0005, ADR-0006, BR-024]
    modules: [platform, service_workflow]
    operations: [getLiveness, getReadiness]
    tests: [TEST-MIGRATION-001, TEST-ARCH-001, TEST-CONTRACT-001, TEST-API-HEALTH-001, TEST-RESPONSIVE-001, TEST-A11Y-001]

  tenant_branch_and_owner_bootstrap:
    implements: [US-A01, US-A02, US-A04, US-R01, US-R02, US-R03, US-R04, NFR-03, NFR-07, NFR-08, NFR-10, NFR-12]
    obeys: [PD-001, PD-004, PD-027, PD-030, PD-032, PD-035, ADR-0002, ADR-0003, ADR-0004, ADR-0005, ADR-0006, CFG-001, CFG-002, CFG-015, PERM-001, PERM-002, PERM-003, PERM-004, PERM-007, PERM-008, BR-001, BR-002, BR-003, BR-021, BR-024]
    modules: [identity_access, restaurant_configuration, audit, service_workflow]
    operations: [bootstrapTenantOwnerRestaurantAndBranch, loginStaff, getStaffSession, logoutStaff, requestStaffCredentialRecovery, completeStaffCredentialRecovery, acceptStaffInvitation, switchStaffBranch, listRestaurants, createRestaurant, getRestaurant, updateRestaurant, listAssignedBranches, createBranch, getAssignedBranch, updateBranch, inviteExistingEmployee, removeAdministrator, transferAdministrator, deactivateEmployeeIdentity]
    tests: [TEST-TENANT-001, TEST-AUTH-001, TEST-SESSION-REVOCATION-001, TEST-INVITATION-001, TEST-RECOVERY-001, TEST-LAST-ADMIN-001, TEST-CONCURRENCY-001, TEST-AUDIT-001, TEST-HTTP-IDENTITY-001, TEST-A11Y-SETUP-001]

  tenant_and_configuration:
    implements: [US-A01, US-A02, US-A03, US-A04, US-B01, US-B02, US-B03, US-B04]
    obeys: [PD-001, PD-002, PD-003, PD-019, PD-026, PD-035, BR-001, BR-003, BR-006, BR-007]
    modules: [restaurant_configuration, audit]
    operations: [getFeatureConfiguration, updateFeatureConfiguration, getRestaurantFeatureConfiguration, updateRestaurantFeatureConfiguration, getPortalCapabilities]
    tests: [TEST-TENANT-001, TEST-CONFIG-001, TEST-CONFIG-DEPENDENCY-001, TEST-CONFIG-CONCURRENCY-001, TEST-CONFIG-HTTP-001, TEST-PORTAL-001, TEST-HOURS-001]
    slice_003_verified_acceptance: [AC-US-B01-01, AC-US-B01-02, AC-US-B01-04, AC-US-B01-05, AC-US-B01-06, AC-US-B02-01, AC-US-B03-01, AC-US-B03-02, AC-US-B03-03, AC-US-B03-04, AC-US-B04-01, AC-US-B04-02]
    cross_slice_acceptance:
      AC-US-B01-02: Customer navigation is verified when its owning customer slices implement normal navigation.
      AC-US-B01-03: Downstream automatic actions and notifications are verified in the slices that implement those consumers; Slice 003 emits configuration-change outbox evidence but does not claim the consumers exist.
      AC-US-B04-03: Active-order completion safety is verified when ordering persists and enforces the stored configuration version.

  identity_and_access:
    implements: [US-C01, US-C02, US-C03, US-C04, US-C06, US-C07, US-C08, US-R01, US-R02, US-R03, US-R04, US-R05]
    obeys: [PD-004, PD-005, PD-027, PD-028, BR-002, BR-003, BR-004, BR-005, BR-025]
    modules: [identity_access, restaurant_configuration, audit]
    operations: [listEmployees, createEmployee, getEmployee, updateEmployee, replaceEmployeeBranches, getEmployeePermissions, replaceEmployeePermissions, listPermissionTemplates, applyPermissionTemplate, createSupportAccessGrant, inspectTenantWithSupportAccess, revokeSupportAccessGrant]
    tests: [TEST-AUTH-001, TEST-EMPLOYEE-001, TEST-EMPLOYEE-EMAIL-001, TEST-PERM-001, TEST-PERM-002, TEST-PERM-SESSION-001, TEST-LAST-ADMIN-001, TEST-SUPPORT-001, TEST-SUPPORT-HTTP-001, TEST-SUPPORT-REVOCATION-001, TEST-PORTAL-001, TEST-A11Y-ADMIN-001, TEST-A11Y-STAFF-001]
    slice_003_verified_acceptance: [AC-US-C01-01, AC-US-C01-02, AC-US-C01-03, AC-US-C01-04, AC-US-C02-01, AC-US-C02-02, AC-US-C02-03, AC-US-C02-04, AC-US-C02-05, AC-US-C03-01, AC-US-C03-02, AC-US-C03-03, AC-US-C04-01, AC-US-C04-02, AC-US-C04-03, AC-US-C04-04, AC-US-C06-01, AC-US-C06-02, AC-US-C06-03, AC-US-C07-03, AC-US-C08-01, AC-US-C08-02, AC-US-C08-03, AC-US-R05-01, AC-US-R05-02, AC-US-R05-03, AC-US-R05-04]
    cross_slice_acceptance:
      AC-US-C07-01: Slice 003 creates stable loginless employee references; assignment and reporting use is verified only when those modules exist.
      AC-US-C07-02: Updating task-module work on a loginless employee's behalf is not implemented or claimed by Slice 003.
      AC-US-R05-04: The implemented direct grant token expires and revokes immediately; the private adapter creates no derived support session or real-time subscription to terminate.

  menu:
    implements: [US-D01, US-D02, US-D03, US-D04, US-D05]
    obeys: [PD-003, PD-018, PD-033, BR-011, BR-012, BR-013, BR-014]
    modules: [menu, audit]
    operations: [listMenuCategories, createMenuCategory, updateMenuCategory, listMenuDishes, createMenuDish, updateMenuDish, createMenuOptionGroup, updateMenuOptionGroup, replaceMenuOptions, upsertBranchDishOverride, getGuestMenu]
    tests: [TEST-MENU-001, TEST-MENU-002, TEST-SNAPSHOT-001]
    slice_004_verified_acceptance: [AC-US-D01-03, AC-US-D02-03, AC-US-D03-03, AC-US-D03-05, AC-US-D03-06, AC-US-D04-01]
    cross_slice_acceptance:
      AC-US-D05-01: Slice 004 implements menu management and guest browse; order-item snapshots require Slice 005's order submission and item persistence.
      AC-US-D05-02: Slice 004 implements menu management and guest browse; order-item snapshots require Slice 005's order submission and item persistence.

  guest_qr_and_tables:
    implements: [US-E01, US-E02, US-E03, US-E04, US-F01, US-F02, US-F04, US-F05]
    obeys: [PD-006, PD-007, PD-008, PD-010, PD-011, PD-012, PD-034, BR-008, BR-009, BR-010, BR-019]
    modules: [tables, ordering, audit]
    operations: [listTables, createTable, updateTable, issueTableQrCode, issueBranchQrCode, revokeQrCode, listQrCodes, exchangeTableQr]
    tests: [TEST-QR-001, TEST-GUEST-001, TEST-TABLE-001, TEST-TABLE-002]
    slice_004_verified_acceptance: [AC-US-E01-01, AC-US-E01-02, AC-US-E01-03, AC-US-E01-04, AC-US-E02-01, AC-US-E02-02, AC-US-E02-03, AC-US-E02-04, AC-US-E03-01, AC-US-E03-02, AC-US-E03-03, AC-US-E03-04, AC-US-F01-01, AC-US-F01-02, AC-US-F01-03, AC-US-F01-04, AC-US-F01-05, AC-US-F02-01, AC-US-F02-02, AC-US-F02-03]
    cross_slice_acceptance:
      AC-US-E04-01: Customer name configuration is not implemented; requires Slice 005's order submission flow.
      AC-US-E04-02: Guest sessions without accounts are implemented; storing customer names in orders requires Slice 005.
      AC-US-E04-03: Customer name storage requires Slice 005's order item persistence.
      AC-US-F04-01: Employee table assignment is not implemented; requires Slice 005's order and table-session lifecycle.
      AC-US-F04-02: Assignment recording is not implemented; requires Slice 005's order lifecycle.
      AC-US-F04-03: Table conflict warnings are not implemented; requires Slice 005's order lifecycle.
      AC-US-F05-01: Multiple orders per table require Slice 005's order persistence and lifecycle.
      AC-US-F05-02: Multiple orders per table require Slice 005's order and table-session management.
      AC-US-F05-03: Order isolation by customer and notes requires Slice 005's order persistence and lifecycle.

  ordering:
    implements: [US-G01, US-G02, US-G03, US-G04, US-G05, US-G06, US-H02, US-H03, US-H04, US-H05]
    obeys: [PD-009, PD-013, PD-029, PD-030, PD-033, BR-007, BR-011, BR-012, BR-022]
    modules: [ordering, menu, tables, kitchen, audit]
    operations: [submitGuestOrder, createStaffOrder, getGuestOrder]
    tests: [TEST-ORDER-001, TEST-ORDER-002, TEST-ORDER-003, TEST-IDEMPOTENCY-001, TEST-CONCURRENCY-001]

  kitchen_and_serving:
    implements: [US-I01, US-I03, US-I04, US-J01, US-J03]
    obeys: [PD-013, PD-014, PD-023, PD-029, BR-017, BR-023]
    modules: [kitchen, ordering, notifications]
    operations: [getKitchenQueue, startKitchenWorkItem, markKitchenWorkItemReady, markOrderServed]
    tests: [TEST-KITCHEN-001, TEST-KITCHEN-002, TEST-SERVE-001]

  payments_and_completion:
    implements: [US-K01, US-K02, US-K03, US-K04]
    obeys: [PD-015, PD-016, PD-017, PD-018, PD-032, BR-013, BR-015, BR-016, BR-017, BR-018]
    modules: [payments, ordering, audit]
    operations: [requestGuestOrderBill, recordOrderPayment, completeOrder]
    tests: [TEST-PAYMENT-001, TEST-PAYMENT-002, TEST-REFUND-001, TEST-COMPLETE-001]

  notifications:
    implements: [US-O01, US-O02, US-O03]
    obeys: [BR-023]
    modules: [notifications]
    tests: [TEST-NOTIFY-001, TEST-REALTIME-001]

  reporting:
    implements: [US-P01, US-P02]
    obeys: [PD-019, PD-025, BR-020, BR-021]
    modules: [reporting]
    tests: [TEST-REPORT-001, TEST-REPORT-002]

  audit_and_deactivation:
    implements: [US-Q01, US-Q02]
    obeys: [PD-032, BR-024, BR-025]
    modules: [audit]
    tests: [TEST-AUDIT-001, TEST-DEACTIVATE-001]

