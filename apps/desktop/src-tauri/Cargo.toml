[package]
name = "mise-desktop"
version = "0.2.0"
description = "MISE restaurant operations for Windows"
edition = "2021"
publish = false

[lib]
name = "mise_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
