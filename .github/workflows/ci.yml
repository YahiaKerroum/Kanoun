name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_DB: rms_test
          POSTGRES_USER: rms
          POSTGRES_PASSWORD: rms_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rms -d rms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://rms:rms_ci_only@127.0.0.1:5432/rms_test
      TEST_DATABASE_URL: postgresql://rms:rms_ci_only@127.0.0.1:5432/rms_test
      NODE_ENV: test
      API_HOST: 127.0.0.1
      API_PORT: 3000
      TRUST_PROXY: "false"
      LOG_LEVEL: silent
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
      WEB_ORIGIN: http://127.0.0.1:5173

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Verify workspace
        run: pnpm check

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser and accessibility smoke tests
        run: pnpm test:browser

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
